networks:
  internal:
    driver: bridge

volumes:
  db_studymate:

services:
  db-studymate:
    image: postgres:18.1-alpine
    container_name: db_studymate
    restart: unless-stopped
    environment:
      POSTGRES_DB: studymate
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: password
    ports:
      - 5477:5432
    volumes:
      - db_studymate:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate -d studymate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
